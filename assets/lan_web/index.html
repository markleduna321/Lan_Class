<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AsuraTECH Classroom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: #0b1020; color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* Top status bar */
  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: #111a33;
    border-bottom: 1px solid #1e293b; flex: 0 0 auto;
  }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; flex: 0 0 auto; }
  #dot.on { background: #22c55e; }
  #dot.off { background: #ef4444; }
  #status { font-size: 14px; color: #cbd5e1; }
  #brand { margin-left: auto; font-weight: 700; color: #60a5fa; font-size: 14px; letter-spacing: .3px; }
  #page-ind { font-size: 13px; color: #94a3b8; }

  /* Stage */
  #stage {
    flex: 1 1 auto; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #0b1020; overflow: hidden;
  }
  #slide {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: none;
    background: #fff;
  }
  #docframe {
    width: 100%; height: 100%; border: 0; display: none; background: #fff;
  }

  /* Waiting / message overlay */
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; gap: 16px;
  }
  #overlay .icon { font-size: 64px; }
  #overlay .title { font-size: 22px; font-weight: 700; color: #f1f5f9; }
  #overlay .sub { font-size: 14px; color: #94a3b8; max-width: 420px; line-height: 1.6; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #1e293b;
    border-top-color: #60a5fa; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Name gate */
  #gate {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11,16,32,.96); padding: 24px;
  }
  #gate .card {
    background: #111a33; border: 1px solid #1e293b; border-radius: 16px;
    padding: 28px; width: 100%; max-width: 380px; text-align: center;
  }
  #gate h1 { font-size: 20px; margin-bottom: 6px; color: #f1f5f9; }
  #gate p { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  #name {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: #0b1020; border: 1px solid #334155; border-radius: 10px;
    color: #e5e7eb; margin-bottom: 14px;
  }
  #name:focus { outline: none; border-color: #60a5fa; }
  #join {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
    background: #2563eb; color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  #join:active { background: #1d4ed8; }

  /* Raise hand button */
  #hand {
    position: absolute; right: 16px; bottom: 16px; z-index: 15;
    width: 56px; height: 56px; border-radius: 50%;
    background: #334155; color: #fff; border: 0; font-size: 24px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none;
  }
  #hand.raised { background: #f59e0b; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="dot"></span>
    <span id="status">Connecting…</span>
    <span id="page-ind"></span>
    <span id="brand">AsuraTECH Classroom</span>
  </div>
  <div id="stage">
    <img id="slide" alt="Slide">
    <iframe id="docframe" title="Document"></iframe>
    <div id="overlay">
      <div class="spinner" id="spinner"></div>
      <div class="icon" id="ovicon" style="display:none">📺</div>
      <div class="title" id="ovtitle">Connecting to classroom…</div>
      <div class="sub" id="ovsub">Please wait while we join the live session.</div>
    </div>
    <button id="hand" title="Raise hand">✋</button>
  </div>
</div>

<!-- Name gate -->
<div id="gate">
  <div class="card">
    <h1>Join the Classroom</h1>
    <p>Enter your name to view the presentation.</p>
    <input id="name" type="text" placeholder="Your name" maxlength="40" autocomplete="off">
    <button id="join">Join</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var slideImg = document.getElementById('slide');
  var docFrame = document.getElementById('docframe');
  var overlay  = document.getElementById('overlay');
  var spinner  = document.getElementById('spinner');
  var ovIcon   = document.getElementById('ovicon');
  var ovTitle  = document.getElementById('ovtitle');
  var ovSub    = document.getElementById('ovsub');
  var statusEl = document.getElementById('status');
  var dot      = document.getElementById('dot');
  var pageInd  = document.getElementById('page-ind');
  var gate     = document.getElementById('gate');
  var nameEl   = document.getElementById('name');
  var joinBtn  = document.getElementById('join');
  var handBtn  = document.getElementById('hand');

  var ws = null;
  var reconnectTimer = null;
  var studentName = '';
  var handRaised = false;

  // Presentation state
  var mode = 'none';       // 'none' | 'image' | 'pdf'
  var currentPage = 0;
  var cacheBust = Date.now();

  // ---- Name gate ----
  try {
    var saved = localStorage.getItem('asura_name');
    if (saved) nameEl.value = saved;
  } catch (e) {}

  function doJoin() {
    var n = (nameEl.value || '').trim();
    if (!n) { nameEl.focus(); return; }
    studentName = n;
    try { localStorage.setItem('asura_name', n); } catch (e) {}
    gate.style.display = 'none';
    handBtn.style.display = 'block';
    connect();
  }
  joinBtn.addEventListener('click', doJoin);
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') doJoin(); });

  // ---- UI helpers ----
  function setStatus(text, state) {
    statusEl.textContent = text;
    dot.className = state || '';
  }
  function showOverlay(icon, title, sub, showSpinner) {
    overlay.style.display = 'flex';
    spinner.style.display = showSpinner ? 'block' : 'none';
    ovIcon.style.display  = showSpinner ? 'none' : 'block';
    ovIcon.textContent = icon || '📺';
    ovTitle.textContent = title || '';
    ovSub.textContent = sub || '';
  }
  function hideOverlay() { overlay.style.display = 'none'; }

  function showImageSlide(index) {
    mode = 'image'; currentPage = index;
    docFrame.style.display = 'none';
    slideImg.style.display = 'block';
    slideImg.src = '/slide/' + index + '?t=' + Date.now();
    hideOverlay();
    pageInd.textContent = 'Page ' + (index + 1);
  }
  function showSingleImage() {
    mode = 'image';
    docFrame.style.display = 'none';
    slideImg.style.display = 'block';
    slideImg.src = '/view?t=' + cacheBust;
    hideOverlay();
    pageInd.textContent = '';
  }
  function showDoc() {
    mode = 'pdf';
    slideImg.style.display = 'none';
    docFrame.style.display = 'block';
    docFrame.src = '/view?t=' + cacheBust;
    hideOverlay();
    pageInd.textContent = '';
  }
  function showWaiting() {
    mode = 'none';
    slideImg.style.display = 'none';
    docFrame.style.display = 'none';
    pageInd.textContent = '';
    showOverlay('📭', 'Waiting for the presentation', 'The instructor has not started sharing yet.', false);
  }

  // ---- Presentation event handling ----
  function startPresentation(info) {
    cacheBust = Date.now();
    var mime = (info && info.mime_type) || 'application/pdf';
    var slides = (info && (info.slide_count || info.slides)) || 0;
    if (mime.indexOf('image/') === 0) {
      // Single image presentation
      showSingleImage();
    } else if (slides > 0) {
      // Rasterized, page-accurate PDF
      showImageSlide(0);
    } else {
      // Fallback: whole document in an iframe
      showDoc();
    }
  }

  function handleEvent(msg) {
    var ev = msg.event;
    if (ev === 'HANDSHAKE_ACK') {
      setStatus('Connected — ' + studentName, 'on');
      if (msg.current_file) {
        startPresentation(msg.current_file);
      } else {
        showWaiting();
      }
    } else if (ev === 'FILE_PRESENTATION_START') {
      startPresentation(msg);
    } else if (ev === 'PAGE_CHANGE') {
      if (mode === 'image' && typeof msg.page_index === 'number') {
        // page_index is 1-based (SfPdfViewer convention), slide files are 0-based
        showImageSlide(msg.page_index - 1);
      }
    } else if (ev === 'PRESENTATION_ENDED') {
      showWaiting();
    }
  }

  // ---- WebSocket ----
  function connect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    setStatus('Connecting…', '');
    showOverlay('', 'Connecting to classroom…', 'Joining the live session.', true);

    var proto = (location.protocol === 'https:') ? 'wss://' : 'ws://';
    try {
      ws = new WebSocket(proto + location.host + '/');
    } catch (e) {
      scheduleReconnect();
      return;
    }

    ws.onopen = function () {
      setStatus('Connected — ' + studentName, 'on');
      send({ event: 'HANDSHAKE', name: studentName });
      showWaiting();
    };
    ws.onmessage = function (e) {
      try { handleEvent(JSON.parse(e.data)); } catch (err) {}
    };
    ws.onclose = function () {
      setStatus('Disconnected — reconnecting…', 'off');
      scheduleReconnect();
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connect();
    }, 3000);
  }

  function send(obj) {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify(obj)); } catch (e) {}
    }
  }

  // ---- Raise hand ----
  handBtn.addEventListener('click', function () {
    handRaised = !handRaised;
    handBtn.className = handRaised ? 'raised' : '';
    if (handRaised) send({ event: 'RAISE_HAND' });
  });

  // Keep the connection warm; some TV browsers sleep sockets.
  setInterval(function () {
    if (ws && ws.readyState === 1) send({ event: 'PING' });
  }, 25000);
})();
</script>
</body>
</html>
